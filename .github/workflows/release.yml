name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install cross-compilation deps
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 \
            libappindicator3-dev:arm64 librsvg2-dev:arm64 \
            patchelf gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--bundles deb' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "ZeroDesk ${{ github.ref_name }}"
          releaseBody: |
            ## ZeroDesk ${{ github.ref_name }}

            ### Installation

            **Ubuntu/Debian (.deb):**
            ```bash
            sudo dpkg -i ZeroDesk_${{ github.ref_name }}_amd64.deb
            sudo apt-get install -f
            ```

            **AppImage (x86_64 only):**
            ```bash
            chmod +x ZeroDesk_${{ github.ref_name }}_amd64.AppImage
            ./ZeroDesk_${{ github.ref_name }}_amd64.AppImage
            ```

            **Requirements:** ZeroTier One installed
            ```bash
            curl -s https://install.zerotier.com | sudo bash
            ```
          releaseDraft: true
          prerelease: false
